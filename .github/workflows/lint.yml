name: Lint and Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./tracker
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Generate protobuf bindings
        run: uv run python scripts/generate_proto.py

      - name: Run ruff check
        run: uv run ruff check src tests scripts

      - name: Run ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Run mypy
        run: uv run mypy src tests scripts

      - name: Install MediaPipe runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2

      - name: Run tests
        run: uv run pytest --benchmark-disable

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: SKIP=ruff-check,ruff-format,mypy pre-commit run --all-files --show-diff-on-failure

  ci-success:
    needs: [lint-and-typecheck, pre-commit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all matrix jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
