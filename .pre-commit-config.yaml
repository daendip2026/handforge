# Hygiene hooks run repo-wide. Project-bound toolchains scope themselves per
# hook: ruff and mypy to tracker/, dotnet format to C#.
#
# The Unity exclusion is repeated per fixer rather than set once at the top
# level. A top-level `exclude` is intersected with every hook's own filter and
# cannot be overridden per hook, so a single top-level entry would also stop the
# checkers from seeing the Unity tree.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Fixers write, and Unity regenerates its own assets, so they skip the
      # Unity tree and every .meta file.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # keep markdown hard line breaks
        exclude: |
          (?x)^(
              avatar/HandForge\.Avatar/Assets/(?!HandForge/Scripts/)
            | avatar/HandForge\.Avatar/(Packages|ProjectSettings)/
          )|\.meta$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              avatar/HandForge\.Avatar/Assets/(?!HandForge/Scripts/)
            | avatar/HandForge\.Avatar/(Packages|ProjectSettings)/
          )|\.meta$
      # Checkers only read, so they run everywhere including Assets/.
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        files: ^tracker/          # Python toolchain is tracker-bound
        args: [--fix]
      - id: ruff-format
        files: ^tracker/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        files: ^tracker/          # config + deps below are tracker-specific
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - types-PyYAML>=6.0
          - types-protobuf>=5.26  # stubs for google.protobuf in generated _pb2
          - pytest-benchmark>=4.0
        args: [--config-file=tracker/pyproject.toml]

  # C# (avatar): normalizes indentation and trailing whitespace per
  # .editorconfig; it re-indents by design. --folder works without Unity's
  # gitignored .csproj files. Requires the .NET SDK.
  - repo: local
    hooks:
      - id: dotnet-format-whitespace
        name: dotnet format whitespace (C#)
        language: system
        types: ["c#"]
        entry: dotnet format whitespace --folder --include
        require_serial: true
        exclude: |
          (?x)^(
              avatar/HandForge\.Avatar/Assets/(?!HandForge/Scripts/)
            | avatar/HandForge\.Avatar/(Packages|ProjectSettings)/
          )|\.meta$
